<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A small server connected to the apps it runs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2236"/>
      <stop offset="1" stop-color="#16425b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <!-- connection lines from server to apps -->
  <g stroke="#7fd1b9" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M1180 110 C1240 110 1250 50 1310 50"/>
    <path d="M1180 110 C1240 110 1250 110 1310 110"/>
    <path d="M1180 110 C1240 110 1250 170 1310 170"/>
    <path d="M1180 110 C1260 110 1330 80 1420 80"/>
    <path d="M1180 110 C1260 110 1330 140 1420 140"/>
  </g>
  <!-- server -->
  <g transform="translate(1060 50)">
    <rect width="120" height="120" rx="10" fill="#e8f1f5"/>
    <g fill="#16425b">
      <rect x="14" y="16" width="92" height="22" rx="4"/>
      <rect x="14" y="49" width="92" height="22" rx="4"/>
      <rect x="14" y="82" width="92" height="22" rx="4"/>
    </g>
    <g fill="#7fd1b9">
      <circle cx="26" cy="27" r="4"/><circle cx="26" cy="60" r="4"/><circle cx="26" cy="93" r="4"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.35">
      <rect x="40" y="25" width="54" height="4" rx="2"/><rect x="40" y="58" width="54" height="4" rx="2"/><rect x="40" y="91" width="54" height="4" rx="2"/>
    </g>
  </g>
  <!-- app tiles: calendar, chart, lock, heartbeat, cloud -->
  <g fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2">
    <rect x="1310" y="28" width="44" height="44" rx="10"/>
    <rect x="1310" y="88" width="44" height="44" rx="10"/>
    <rect x="1310" y="148" width="44" height="44" rx="10"/>
    <rect x="1420" y="58" width="44" height="44" rx="10"/>
    <rect x="1420" y="118" width="44" height="44" rx="10"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- calendar -->
    <rect x="1321" y="41" width="22" height="20" rx="2"/><path d="M1321 47h22M1327 37v6M1337 37v6"/>
    <!-- lock -->
    <rect x="1322" y="107" width="20" height="15" rx="2"/><path d="M1326 107v-4a6 6 0 0 1 12 0v4"/>
    <!-- chart -->
    <path d="M1320 182v-10M1328 182v-16M1336 182v-8M1344 182v-20"/>
    <!-- heartbeat -->
    <path d="M1428 81h8l4-9 6 17 4-8h6"/>
    <!-- cloud/backup -->
    <path d="M1432 147h22a6 6 0 0 0 0-12 9 9 0 0 0-17-2 6 6 0 0 0-5 14z"/>
  </g>
</svg>
